<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#000000"
>

<link
  rel="manifest"
  href="./manifest.webmanifest"
>

<title>BABYFACE Planet's 広陵店 Digital Signage</title>


<style>

/* ==============================
   基本設定
================================ */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#fff;

}

body{

  display:flex;

  align-items:center;
  justify-content:center;

}


/* ==============================
   サイネージ画面
================================ */

#stage{

  position:relative;

  width:100vw;
  height:100vh;

  overflow:hidden;

  background:#fff;

}


/* ==============================
   スライド
================================ */

.slide{

  position:absolute;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:#fff;

}

.slide.active{

  display:flex;

}


/* ==============================
   画像
================================ */

.slide img{

  width:100%;
  height:100%;

  object-fit:contain;

  object-position:center;

  display:block;

  background:#fff;

}


/* ==============================
   動画
================================ */

.slide video{

  width:100vw;
  height:100vh;

  object-fit:contain;

  object-position:center;

  display:block;

  background:#000;

}

</style>

</head>


<body>


<div id="stage">


  <!-- ==========================
       支払い方法
  =========================== -->

  <div class="slide">

    <img
      src="payment.png"
      alt=""
    >

  </div>


  <!-- ==========================
       ランキング
       ※平日11:00〜14:59は
         lunch.pngに自動変更
  =========================== -->

  <div class="slide ranking-slide">

    <img
      src="ranking.png"
      alt=""
    >

  </div>


  <!-- ==========================
       Instagram動画
  =========================== -->

  <div class="slide">

    <video
      src="instagram.mp4"
      autoplay
      muted
      playsinline
      loop>
    </video>

  </div>


  <!-- ==========================
       フード
  =========================== -->

  <div class="slide">

    <img
      src="food.png"
      alt=""
    >

  </div>


  <!-- ==========================
       デザート
  =========================== -->

  <div class="slide">

    <img
      src="dessert.png"
      alt=""
    >

  </div>


  <!-- ==========================
       ドリンク
       ※毎月20日のみ表示
  =========================== -->

  <div class="slide drink-slide">

    <img
      src="drink.png"
      alt=""
    >

  </div>


</div>



<!-- ==================================================
     サイネージ制御
================================================== -->

<script>

(function(){


  /* ==============================
     スライド取得
  ============================== */

  var all = [].slice.call(
    document.querySelectorAll(".slide")
  );


  /* ==============================
     特別スライド
  ============================== */

  var drink =
    document.querySelector(".drink-slide");

  var ranking =
    document.querySelector(".ranking-slide");


  /* ==============================
     状態
  ============================== */

  var visible = [];

  var current = 0;

  var timer = null;

  var SIX = 6000;

  var night = false;

  var lunch = false;


  /* ==============================
     毎月20日
  ============================== */

  function isDrinkDay(){

    return new Date().getDate() === 20;

  }


  /* ==============================
     平日11:00〜14:59
  ============================== */

 /* ==============================
   日本の祝日判定
================================ */

function isJapaneseHoliday(date){

  var year = date.getFullYear();
  var month = date.getMonth() + 1;
  var day = date.getDate();

  function d(y, m, d){
    return y + "-" +
      String(m).padStart(2,"0") + "-" +
      String(d).padStart(2,"0");
  }

  function nthMonday(y, m, n){

    var date = new Date(y, m - 1, 1);

    var firstMonday =
      (8 - date.getDay()) % 7 + 1;

    return firstMonday + (n - 1) * 7;

  }

  function vernalEquinoxDay(y){

    return Math.floor(
      20.8431 +
      0.242194 * (y - 1980) -
      Math.floor((y - 1980) / 4)
    );

  }

  function autumnalEquinoxDay(y){

    return Math.floor(
      23.2488 +
      0.242194 * (y - 1980) -
      Math.floor((y - 1980) / 4)
    );

  }


  var holidays = {};


  /* ------------------------------
     固定祝日
  ------------------------------ */

  holidays[d(year,1,1)] = true;      // 元日
  holidays[d(year,2,11)] = true;     // 建国記念の日
  holidays[d(year,2,23)] = true;     // 天皇誕生日

  holidays[d(year,4,29)] = true;     // 昭和の日
  holidays[d(year,5,3)] = true;      // 憲法記念日
  holidays[d(year,5,4)] = true;      // みどりの日
  holidays[d(year,5,5)] = true;      // こどもの日

  holidays[d(year,8,11)] = true;     // 山の日

  holidays[d(year,11,3)] = true;     // 文化の日
  holidays[d(year,11,23)] = true;    // 勤労感謝の日


  /* ------------------------------
     春分の日
  ------------------------------ */

  holidays[
    d(year,3,vernalEquinoxDay(year))
  ] = true;


  /* ------------------------------
     秋分の日
  ------------------------------ */

  holidays[
    d(year,9,autumnalEquinoxDay(year))
  ] = true;


  /* ------------------------------
     成人の日
     1月第2月曜日
  ------------------------------ */

  holidays[
    d(
      year,
      1,
      nthMonday(year,1,2)
    )
  ] = true;


  /* ------------------------------
     海の日
     7月第3月曜日
  ------------------------------ */

  holidays[
    d(
      year,
      7,
      nthMonday(year,7,3)
    )
  ] = true;


  /* ------------------------------
     敬老の日
     9月第3月曜日
  ------------------------------ */

  holidays[
    d(
      year,
      9,
      nthMonday(year,9,3)
    )
  ] = true;


  /* ------------------------------
     スポーツの日
     10月第2月曜日
  ------------------------------ */

  holidays[
    d(
      year,
      10,
      nthMonday(year,10,2)
    )
  ] = true;


  /* ------------------------------
     国民の休日
     
     祝日と祝日の間の平日
  ------------------------------ */

  var checkDate =
    new Date(year,0,1);

  while(checkDate.getFullYear() === year){

    var key =
      d(
        checkDate.getFullYear(),
        checkDate.getMonth() + 1,
        checkDate.getDate()
      );

    if(!holidays[key]){

      var previous =
        new Date(checkDate);

      previous.setDate(
        previous.getDate() - 1
      );

      var next =
        new Date(checkDate);

      next.setDate(
        next.getDate() + 1
      );

      var previousKey =
        d(
          previous.getFullYear(),
          previous.getMonth() + 1,
          previous.getDate()
        );

      var nextKey =
        d(
          next.getFullYear(),
          next.getMonth() + 1,
          next.getDate()
        );

      if(
        holidays[previousKey] &&
        holidays[nextKey]
      ){

        holidays[key] = true;

      }

    }

    checkDate.setDate(
      checkDate.getDate() + 1
    );

  }


  /* ------------------------------
     振替休日
     
     日曜日に祝日が重なった場合、
     次の平日を休日にする
  ------------------------------ */

  var holidayKeys =
    Object.keys(holidays);

  holidayKeys.forEach(function(key){

    var parts =
      key.split("-");

    var hDate =
      new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
      );

    if(hDate.getDay() === 0){

      var substitute =
        new Date(hDate);

      substitute.setDate(
        substitute.getDate() + 1
      );

      while(true){

        var subKey =
          d(
            substitute.getFullYear(),
            substitute.getMonth() + 1,
            substitute.getDate()
          );

        if(!holidays[subKey]){

          holidays[subKey] = true;

          break;

        }

        substitute.setDate(
          substitute.getDate() + 1
        );

      }

    }

  });


  return holidays[
    d(year,month,day)
  ] === true;

}


/* ==============================
   平日11:00〜14:59
   祝日は除外
================================ */

function isWeekdayLunchTime(){

  var now = new Date();

  var day =
    now.getDay();

  var hour =
    now.getHours();


  /* 月〜金 */

  var weekday =
    day >= 1 &&
    day <= 5;


  /* 11:00〜14:59 */

  var lunchTime =
    hour >= 11 &&
    hour < 15;


  /* 日本の祝日ではない */

  var holiday =
    isJapaneseHoliday(now);


  return (
    weekday &&
    lunchTime &&
    !holiday
  );

}

  /* ==============================
     夜間
     
     23:00〜翌09:59
  ============================== */

  function isNightTime(){

    var now = new Date();

    var hour = now.getHours();


    return (
      hour >= 23 ||
      hour < 10
    );

  }


  /* ==============================
     表示するスライドを作る
  ============================== */

  function rebuild(){

    visible = all.filter(function(slide){

      /*
        drink.pngは
        毎月20日のみ
      */

      if(slide === drink){

        return isDrinkDay();

      }


      return true;

    });

  }


  /* ==============================
     黒画面を表示
  ============================== */

  function createBlackScreen(){

    if(
      document.getElementById(
        "night-screen"
      )
    ){

      return;

    }


    var screen =
      document.createElement("div");


    screen.id =
      "night-screen";


    screen.style.position =
      "fixed";

    screen.style.left =
      "0";

    screen.style.top =
      "0";

    screen.style.width =
      "100vw";

    screen.style.height =
      "100vh";

    screen.style.background =
      "#000";

    screen.style.zIndex =
      "99999";


    document.body.appendChild(
      screen
    );

  }


  /* ==============================
     黒画面を解除
  ============================== */

  function removeBlackScreen(){

    var screen =
      document.getElementById(
        "night-screen"
      );


    if(screen){

      screen.remove();

    }

  }


  /* ==============================
     ランチ画像を設定
  ============================== */

  function updateRankingImage(){

    if(!ranking){

      return;

    }


    var img =
      ranking.querySelector("img");


    if(!img){

      return;

    }


    if(
      isWeekdayLunchTime()
    ){

      img.src =
        "lunch.png";

      lunch = true;

    }else{

      img.src =
        "ranking.png";

      lunch = false;

    }

  }


  /* ==============================
     スライド表示
  ============================== */

  function show(i){


    /* ==========================
       夜間
    ========================== */

    if(isNightTime()){

      night = true;

      clearTimeout(timer);


      all.forEach(function(slide){

        slide.classList.remove(
          "active"
        );


        var video =
          slide.querySelector(
            "video"
          );


        if(video){

          video.pause();

          video.currentTime = 0;

        }

      });


      createBlackScreen();

      return;

    }


    /* ==========================
       昼間
    ========================== */

    night = false;

    removeBlackScreen();


    rebuild();


    if(!visible.length){

      return;

    }


    if(
      i >= visible.length
    ){

      i = 0;

    }


    current = i;


    clearTimeout(timer);


    /* ==========================
       全スライド停止
    ========================== */

    all.forEach(function(slide){

      slide.classList.remove(
        "active"
      );


      var video =
        slide.querySelector(
          "video"
        );


      if(video){

        video.pause();

        video.currentTime = 0;

      }

    });


    /* ==========================
       ランキング画像を
       時間帯に応じて変更
    ========================== */

    updateRankingImage();


    /* ==========================
       現在のスライド
    ========================== */

    var slide =
      visible[current];


    slide.classList.add(
      "active"
    );


    /* ==========================
       動画の場合
    ========================== */

    var video =
      slide.querySelector(
        "video"
      );


    if(video){

      video.currentTime = 0;


      var p =
        video.play();


      if(p){

        p.catch(
          function(){}
        );

      }


      video.onended =
        function(){

          show(
            (current + 1) %
            visible.length
          );

        };


      /*
        動画がループしても
        6秒で次へ進む
      */

      timer =
        setTimeout(
          function(){

            if(!video.ended){

              show(
                (current + 1) %
                visible.length
              );

            }

          },
          SIX
        );


    }else{


      /* ========================
         画像の場合
      ======================== */

      timer =
        setTimeout(
          function(){

            show(
              (current + 1) %
              visible.length
            );

          },
          SIX
        );

    }

  }


  /* ==============================
     時間帯変更チェック
  ============================== */

  function checkMode(){


    /* ==========================
       夜間チェック
    ========================== */

    var nowNight =
      isNightTime();


    if(
      nowNight !== night
    ){

      night =
        nowNight;


      current = 0;


      show(0);


      return;

    }


    /* ==========================
       ランチ時間変更チェック
    ========================== */

    var nowLunch =
      isWeekdayLunchTime();


    if(
      nowLunch !== lunch
    ){

      lunch =
        nowLunch;


      /*
        ランキング画像を更新
      */

      updateRankingImage();


      /*
        スライドを先頭から再開
      */

      current = 0;


      show(0);


      return;

    }


    /* ==========================
       毎月20日チェック
    ========================== */

    var wantDrink =
      isDrinkDay();


    var hasDrink =
      visible.indexOf(drink) !== -1;


    if(
      wantDrink !== hasDrink
    ){

      current = 0;

      show(0);

    }

  }


  /* ==============================
     初期化
  ============================== */

  rebuild();


  night =
    isNightTime();


  lunch =
    isWeekdayLunchTime();


  updateRankingImage();


  show(0);


  /* ==============================
     1分ごとにチェック
  ============================== */

  setInterval(
    function(){

      checkMode();

    },
    60000
  );


})();

</script>



<!-- ==================================================
     フルスクリーン
================================================== -->

<script>

(function(){


  function goFullscreen(){

    var el =
      document.documentElement;


    try{


      if(
        el.requestFullscreen
      ){

        var p =
          el.requestFullscreen();


        if(
          p &&
          p.catch
        ){

          p.catch(
            function(){}
          );

        }


      }else if(
        el.webkitRequestFullscreen
      ){

        el.webkitRequestFullscreen();


      }else if(
        el.webkitEnterFullscreen
      ){

        el.webkitEnterFullscreen();

      }


    }catch(e){}

  }


  document.addEventListener(
    "click",
    goFullscreen,
    false
  );


  document.addEventListener(
    "touchend",
    goFullscreen,
    false
  );


})();

</script>


</body>

</html>
