<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BABYFACE Koryo Signage</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;width:100%;height:100%;
    background:#000;overflow:hidden;
    touch-action:manipulation;
  }
  body{
    display:flex;align-items:center;justify-content:center;
  }
  #stage{
    width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#000;overflow:hidden;
  }
  #slide{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }
  @media (orientation:landscape){
    #slide{
      width:100vh;height:100vw;
      transform:rotate(90deg);
      object-fit:contain;
    }
  }
</style>
</head>
<body>
<div id="stage"><img id="slide" alt=""></div>

<script>
(() => {
  const allSlides = [
    {src:"ranking.png", alt:""},
    {src:"instagram.png", alt:""},
    {src:"staff.png", alt:""},
    {src:"food.jpg", alt:""},
    {src:"dessert.jpg", alt:""}
  ];

  const drinkSlide = {src:"drink.png", alt:""};

  // Only the 20th of each month shows the drink half-price artwork.
  const img = document.getElementById("slide");
  let index = 0;
  let slides = [];
  let lastDay = null;
  const intervalMs = 7000;

  function buildPlaylist(){
    const day = new Date().getDate();
    const isDrinkDay = day === 20;
    return isDrinkDay
      ? [allSlides[0], drinkSlide, ...allSlides.slice(1)]
      : allSlides;
  }

  function refreshPlaylist(){
    const day = new Date().getDate();
    if(day !== lastDay){
      lastDay = day;
      slides = buildPlaylist();
      index = 0;
      show(0);
    }
  }

  function show(i){
    if(!slides.length) slides = buildPlaylist();
    index = (i + slides.length) % slides.length;
    img.src = slides[index].src;
    img.alt = slides[index].alt;
  }

  refreshPlaylist();
  setInterval(() => {
    refreshPlaylist();
    show(index + 1);
  }, intervalMs);

  // Repaint after orientation changes.
  window.addEventListener("resize", () => {
    requestAnimationFrame(() => show(index));
  });

  // Try immersive fullscreen when launched from a home-screen/PWA shortcut.
  async function enterFullscreen(){
    try{
      if(document.fullscreenElement) return;
      if(document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
      }
    }catch(e){}
  }
  document.addEventListener("click", enterFullscreen, {once:true});
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
