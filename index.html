<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<title>BABYFACE Planet's 広陵店 Digital Signage</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#fff}
.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff}
.slide.active{display:flex}
.slide img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;background:#fff}
</style>
</head>
<body>
<div id="stage">
  <div class="slide"><img src="payment.jpg" alt=""></div>
  <div class="slide"><img src="ranking.png" alt=""></div>

  <div class="slide" id="instagramSlide">
    <img id="instagramFrame" src="instagram_01.jpg" alt="">
  </div>

  <div class="slide"><img src="food.jpg" alt=""></div>
  <div class="slide"><img src="dessert.png" alt=""></div>
  <div class="slide" id="drinkSlide"><img src="drink.png" alt=""></div>
</div>

<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll(".slide"));
  var instagram=document.getElementById("instagramSlide");
  var frame=document.getElementById("instagramFrame");
  var drink=document.getElementById("drinkSlide");

  var frames=[];
  for(var i=1;i<=12;i++){
    var n=("0"+i).slice(-2);
    frames.push("instagram_"+n+".jpg");
  }

  /* 先読みしておく */
  frames.forEach(function(src){
    var img=new Image();
    img.src=src;
  });

  var visible=[];
  var current=0;
  var slideTimer=null;
  var frameTimer=null;
  var frameIndex=0;

  function isDrinkDay(){
    return new Date().getDate()===20;
  }

  function rebuild(){
    visible=slides.filter(function(s){
      return s!==drink || isDrinkDay();
    });
  }

  function stopFrames(){
    if(frameTimer){
      clearInterval(frameTimer);
      frameTimer=null;
    }
  }

  function startFrames(){
    stopFrames();
    frameIndex=0;
    frame.src=frames[0];

    /* 約0.42秒ごと。5秒で12枚を一周 */
    frameTimer=setInterval(function(){
      frameIndex=(frameIndex+1)%frames.length;
      frame.src=frames[frameIndex];
    },420);
  }

  function show(index){
    rebuild();
    if(!visible.length)return;

    if(index>=visible.length)index=0;
    current=index;

    slides.forEach(function(s){
      s.classList.remove("active");
    });

    var target=visible[current];
    target.classList.add("active");

    if(target===instagram){
      startFrames();
    }else{
      stopFrames();
    }

    clearTimeout(slideTimer);
    slideTimer=setTimeout(function(){
      show((current+1)%visible.length);
    },6000);
  }

  rebuild();
  show(0);

  /* 毎月20日になったらドリンクページを自動追加 */
  setInterval(function(){
    var shouldShow=isDrinkDay();
    var currentlyShown=visible.indexOf(drink)!==-1;
    if(shouldShow!==currentlyShown){
      current=0;
      show(0);
    }
  },60000);
})();
</script>
</body>
</html>
