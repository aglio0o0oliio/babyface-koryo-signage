<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#000000"
>

<link
  rel="manifest"
  href="./manifest.webmanifest"
>

<title>BABYFACE Planet's 広陵店 Digital Signage</title>


<style>

/* ==============================
   基本設定
================================ */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#fff;

}

body{

  display:flex;

  align-items:center;
  justify-content:center;

}


/* ==============================
   サイネージ画面
================================ */

#stage{

  position:relative;

  width:100vw;
  height:100vh;

  overflow:hidden;

  background:#fff;

}


/* ==============================
   スライド
================================ */

.slide{

  position:absolute;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:#fff;

}

.slide.active{

  display:flex;

}


/* ==============================
   画像
================================ */

.slide img{

  width:100%;
  height:100%;

  object-fit:contain;

  object-position:center;

  display:block;

  background:#fff;

}


/* ==============================
   動画
================================ */

.slide video{

  width:100vw;
  height:100vh;

  object-fit:contain;

  object-position:center;

  display:block;

  background:#000;

}

</style>

</head>


<body>


<div id="stage">


  <!-- ==========================
       支払い方法
  =========================== -->

  <div class="slide">

    <img
      src="payment.png"
      alt=""
    >

  </div>


  <!-- ==========================
       ランキング
       ※平日11:00〜14:59は
         lunch.pngに自動変更
  =========================== -->

  <div class="slide ranking-slide">

    <img
      src="ranking.png"
      alt=""
    >

  </div>


  <!-- ==========================
       Instagram動画
  =========================== -->

  <div class="slide">

    <video
      src="instagram.mp4"
      autoplay
      muted
      playsinline
      loop>
    </video>

  </div>


  <!-- ==========================
       フード
  =========================== -->

  <div class="slide">

    <img
      src="food.png"
      alt=""
    >

  </div>


  <!-- ==========================
       デザート
  =========================== -->

  <div class="slide">

    <img
      src="dessert.png"
      alt=""
    >

  </div>


  <!-- ==========================
       ドリンク
       ※毎月20日のみ表示
  =========================== -->

  <div class="slide drink-slide">

    <img
      src="drink.png"
      alt=""
    >

  </div>


</div>



<!-- ==================================================
     サイネージ制御
================================================== -->

<script>

(function(){


  /* ==============================
     スライド取得
  ============================== */

  var all = [].slice.call(
    document.querySelectorAll(".slide")
  );


  /* ==============================
     特別スライド
  ============================== */

  var drink =
    document.querySelector(".drink-slide");

  var ranking =
    document.querySelector(".ranking-slide");


  /* ==============================
     状態
  ============================== */

  var visible = [];

  var current = 0;

  var timer = null;

  var SIX = 6000;

  var night = false;

  var lunch = false;


  /* ==============================
     毎月20日
  ============================== */

  function isDrinkDay(){

    return new Date().getDate() === 20;

  }


  /* ==============================
     平日11:00〜14:59
  ============================== */

  function isWeekdayLunchTime(){

    var now = new Date();

    var day = now.getDay();

    var hour = now.getHours();


    /*
      月曜日 = 1
      火曜日 = 2
      水曜日 = 3
      木曜日 = 4
      金曜日 = 5
      土曜日 = 6
      日曜日 = 0
    */

    var weekday =
      day >= 1 &&
      day <= 5;


    /*
      11:00〜14:59
    */

    var lunchTime =
      hour >= 11 &&
      hour < 15;


    return weekday && lunchTime;

  }


  /* ==============================
     夜間
     
     23:00〜翌09:59
  ============================== */

  function isNightTime(){

    var now = new Date();

    var hour = now.getHours();


    return (
      hour >= 23 ||
      hour < 10
    );

  }


  /* ==============================
     表示するスライドを作る
  ============================== */

  function rebuild(){

    visible = all.filter(function(slide){

      /*
        drink.pngは
        毎月20日のみ
      */

      if(slide === drink){

        return isDrinkDay();

      }


      return true;

    });

  }


  /* ==============================
     黒画面を表示
  ============================== */

  function createBlackScreen(){

    if(
      document.getElementById(
        "night-screen"
      )
    ){

      return;

    }


    var screen =
      document.createElement("div");


    screen.id =
      "night-screen";


    screen.style.position =
      "fixed";

    screen.style.left =
      "0";

    screen.style.top =
      "0";

    screen.style.width =
      "100vw";

    screen.style.height =
      "100vh";

    screen.style.background =
      "#000";

    screen.style.zIndex =
      "99999";


    document.body.appendChild(
      screen
    );

  }


  /* ==============================
     黒画面を解除
  ============================== */

  function removeBlackScreen(){

    var screen =
      document.getElementById(
        "night-screen"
      );


    if(screen){

      screen.remove();

    }

  }


  /* ==============================
     ランチ画像を設定
  ============================== */

  function updateRankingImage(){

    if(!ranking){

      return;

    }


    var img =
      ranking.querySelector("img");


    if(!img){

      return;

    }


    if(
      isWeekdayLunchTime()
    ){

      img.src =
        "lunch.png";

      lunch = true;

    }else{

      img.src =
        "ranking.png";

      lunch = false;

    }

  }


  /* ==============================
     スライド表示
  ============================== */

  function show(i){


    /* ==========================
       夜間
    ========================== */

    if(isNightTime()){

      night = true;

      clearTimeout(timer);


      all.forEach(function(slide){

        slide.classList.remove(
          "active"
        );


        var video =
          slide.querySelector(
            "video"
          );


        if(video){

          video.pause();

          video.currentTime = 0;

        }

      });


      createBlackScreen();

      return;

    }


    /* ==========================
       昼間
    ========================== */

    night = false;

    removeBlackScreen();


    rebuild();


    if(!visible.length){

      return;

    }


    if(
      i >= visible.length
    ){

      i = 0;

    }


    current = i;


    clearTimeout(timer);


    /* ==========================
       全スライド停止
    ========================== */

    all.forEach(function(slide){

      slide.classList.remove(
        "active"
      );


      var video =
        slide.querySelector(
          "video"
        );


      if(video){

        video.pause();

        video.currentTime = 0;

      }

    });


    /* ==========================
       ランキング画像を
       時間帯に応じて変更
    ========================== */

    updateRankingImage();


    /* ==========================
       現在のスライド
    ========================== */

    var slide =
      visible[current];


    slide.classList.add(
      "active"
    );


    /* ==========================
       動画の場合
    ========================== */

    var video =
      slide.querySelector(
        "video"
      );


    if(video){

      video.currentTime = 0;


      var p =
        video.play();


      if(p){

        p.catch(
          function(){}
        );

      }


      video.onended =
        function(){

          show(
            (current + 1) %
            visible.length
          );

        };


      /*
        動画がループしても
        6秒で次へ進む
      */

      timer =
        setTimeout(
          function(){

            if(!video.ended){

              show(
                (current + 1) %
                visible.length
              );

            }

          },
          SIX
        );


    }else{


      /* ========================
         画像の場合
      ======================== */

      timer =
        setTimeout(
          function(){

            show(
              (current + 1) %
              visible.length
            );

          },
          SIX
        );

    }

  }


  /* ==============================
     時間帯変更チェック
  ============================== */

  function checkMode(){


    /* ==========================
       夜間チェック
    ========================== */

    var nowNight =
      isNightTime();


    if(
      nowNight !== night
    ){

      night =
        nowNight;


      current = 0;


      show(0);


      return;

    }


    /* ==========================
       ランチ時間変更チェック
    ========================== */

    var nowLunch =
      isWeekdayLunchTime();


    if(
      nowLunch !== lunch
    ){

      lunch =
        nowLunch;


      /*
        ランキング画像を更新
      */

      updateRankingImage();


      /*
        スライドを先頭から再開
      */

      current = 0;


      show(0);


      return;

    }


    /* ==========================
       毎月20日チェック
    ========================== */

    var wantDrink =
      isDrinkDay();


    var hasDrink =
      visible.indexOf(drink) !== -1;


    if(
      wantDrink !== hasDrink
    ){

      current = 0;

      show(0);

    }

  }


  /* ==============================
     初期化
  ============================== */

  rebuild();


  night =
    isNightTime();


  lunch =
    isWeekdayLunchTime();


  updateRankingImage();


  show(0);


  /* ==============================
     1分ごとにチェック
  ============================== */

  setInterval(
    function(){

      checkMode();

    },
    60000
  );


})();

</script>



<!-- ==================================================
     フルスクリーン
================================================== -->

<script>

(function(){


  function goFullscreen(){

    var el =
      document.documentElement;


    try{


      if(
        el.requestFullscreen
      ){

        var p =
          el.requestFullscreen();


        if(
          p &&
          p.catch
        ){

          p.catch(
            function(){}
          );

        }


      }else if(
        el.webkitRequestFullscreen
      ){

        el.webkitRequestFullscreen();


      }else if(
        el.webkitEnterFullscreen
      ){

        el.webkitEnterFullscreen();

      }


    }catch(e){}

  }


  document.addEventListener(
    "click",
    goFullscreen,
    false
  );


  document.addEventListener(
    "touchend",
    goFullscreen,
    false
  );


})();

</script>


</body>

</html>
