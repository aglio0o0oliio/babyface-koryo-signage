<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<title>BABYFACE Planet's 広陵店 Digital Signage</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#fff}
.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#fff}
.slide.active{display:flex}
.slide img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;background:#fff}
</style>
</head>
<body>
<div id="stage">
  <div class="slide"><img src="payment.jpg" alt=""></div>
  <div class="slide"><img src="ranking.png" alt=""></div>
  <div class="slide"><img src="instagram.gif" alt=""></div>
  <div class="slide"><img src="food.jpg" alt=""></div>
  <div class="slide"><img src="dessert.png" alt=""></div>
  <div class="slide drink-slide"><img src="drink.png" alt=""></div>
</div>
<script>
(function(){
  var all=[].slice.call(document.querySelectorAll(".slide"));
  var drink=document.querySelector(".drink-slide");
  var visible=[],current=0,timer=null,SIX=6000;
  function isDrinkDay(){return new Date().getDate()===20;}
  function rebuild(){visible=all.filter(function(s){return s!==drink||isDrinkDay();});}
  function show(i){
    rebuild();
    if(!visible.length)return;
    if(i>=visible.length)i=0;
    current=i;
    all.forEach(function(s){s.classList.remove("active");});
    visible[current].classList.add("active");
    clearTimeout(timer);
    timer=setTimeout(function(){show((current+1)%visible.length);},SIX);
  }
  rebuild(); show(0);
  setInterval(function(){
    var want=isDrinkDay(),has=visible.indexOf(drink)!==-1;
    if(want!==has){current=0;show(0);}
  },60000);
})();
</script>
</body>
</html>
