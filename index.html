<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">

  <title>BABYFACE Planet's 広陵店</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #screen {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .slide.active {
      display: block;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      background: #000;
    }

    #video.active {
      display: block;
    }

    /* =========================
       朝のスタッフ画面
       ========================= */

    #morning {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      background: #f7f4ec;
      color: #333;
    }

    #morning.active {
      display: flex;
    }

    #morning-message {
      width: 100%;
      height: 50%;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 5vh 7vw;

      background:
        linear-gradient(
          180deg,
          #fffdf7 0%,
          #f8f4e9 100%
        );
    }

    .morning-greeting {
      font-size: clamp(28px, 5vw, 72px);
      font-weight: 700;
      margin-bottom: 2vh;
      letter-spacing: 0.04em;
    }

    .morning-text {
      max-width: 90%;
      white-space: pre-line;

      font-size: clamp(22px, 3.5vw, 52px);
      line-height: 1.6;
      font-weight: 500;
    }

    /* =========================
       天気
       ========================= */

    #weather {
      width: 100%;
      height: 50%;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 3vh 5vw;

      background:
        linear-gradient(
          180deg,
          #eaf5ff 0%,
          #dcefff 100%
        );
    }

    .weather-title {
      font-size: clamp(20px, 3vw, 42px);
      font-weight: 700;
      margin-bottom: 1.5vh;
    }

    .weather-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3vw;
    }

    .weather-icon {
      font-size: clamp(60px, 10vw, 130px);
      line-height: 1;
    }

    .weather-condition {
      font-size: clamp(24px, 4vw, 56px);
      font-weight: 700;
    }

    .weather-temperature {
      font-size: clamp(32px, 5vw, 70px);
      font-weight: 700;
      margin-top: 1vh;
    }

    .weather-details {
      display: flex;
      justify-content: center;
      gap: 5vw;
      margin-top: 2vh;

      font-size: clamp(18px, 2.5vw, 34px);
    }

    .weather-updated {
      margin-top: 1.5vh;
      font-size: clamp(12px, 1.5vw, 20px);
      opacity: 0.65;
    }

    .weather-error {
      font-size: clamp(18px, 3vw, 36px);
      line-height: 1.6;
      opacity: 0.7;
    }

    /* =========================
       閉店後
       ========================= */

    #close {
      position: absolute;
      inset: 0;
      display: none;
      background: #000;
    }

    #close.active {
      display: block;
    }

    #close img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================
       黒画面
       ========================= */

    #black {
      position: absolute;
      inset: 0;
      background: #000;
      display: none;
    }

    #black.active {
      display: block;
    }

  </style>
</head>

<body>

  <div id="screen">

    <!-- 通常サイネージ -->
    <img
      id="slide"
      class="slide"
      src=""
      alt="BABYFACE signage"
    >

    <!-- Instagram動画 -->
    <video
      id="video"
      muted
      autoplay
      loop
      playsinline
      preload="auto">

      <source
        src="instagram.mp4"
        type="video/mp4">

    </video>


    <!-- =========================
         朝のスタッフ画面
         ========================= -->

    <div id="morning">

      <!-- 上半分 -->
      <div id="morning-message">

        <div class="morning-greeting">
          ☀️ おはようございます
        </div>

        <div
          id="morning-text"
          class="morning-text">

          今日も一日、笑顔で頑張りましょう！

        </div>

      </div>


      <!-- 下半分 -->
      <div id="weather">

        <div class="weather-title">
          📍 奈良県北葛城郡広陵町　今日の天気
        </div>

        <div id="weather-content">

          <div class="weather-error">
            天気情報を取得しています…
          </div>

        </div>

      </div>

    </div>


    <!-- 閉店画面 -->
    <div id="close">

      <img
        src="close.png"
        alt="ご来店ありがとうございました">

    </div>


    <!-- 黒画面 -->
    <div id="black"></div>

  </div>


  <script>

    /* =====================================================
       設定
       ===================================================== */

    const SLIDE_TIME = 3000;

    const WEATHER_UPDATE_TIME =
      30 * 60 * 1000;


    /*
      奈良県北葛城郡広陵町付近
    */

    const WEATHER_LAT = 34.54274;
    const WEATHER_LON = 135.750842;


    /* =====================================================
       DOM
       ===================================================== */

    const slide =
      document.getElementById("slide");

    const video =
      document.getElementById("video");

    const morning =
      document.getElementById("morning");

    const morningText =
      document.getElementById("morning-text");

    const weatherContent =
      document.getElementById("weather-content");

    const closeScreen =
      document.getElementById("close");

    const blackScreen =
      document.getElementById("black");


    /* =====================================================
       スライド
       ===================================================== */

    const slides = [

      "payment.png",

      "drink.png",

      "ranking.png",

      "instagram.mp4",

      "payment.png",

      "food.png",

      "dessert.png",

      "koryo.png"

    ];


    let currentSlide = 0;

    let currentMode = "";

    let slideTimer = null;


    /* =====================================================
       朝のメッセージ
       ===================================================== */

    const morningMessages = [

      "今日も一日、笑顔で頑張りましょう！",

      "今日もよろしくお願いします！\n気持ちよくスタートしましょう。",

      "お客様に喜んでいただける一日にしましょう！",

      "今日もチームワークで頑張りましょう！",

      "一人ひとりの笑顔がお店の雰囲気を作ります。\n今日もよろしくお願いします！",

      "元気に丁寧な仕事でいきましょう！",

      "今日も元気にいきましょう！",

      "小さな気配りを大切に。\n今日もよろしくお願いします！",

      "今日も素敵な一日にしましょう！",

      "本日もよろしくお願いします。\n笑顔でお客様をお迎えしましょう！"

    ];


    /* =====================================================
       日本時間の日付
       ===================================================== */

    function getLocalDateKey() {

      const now = new Date();

      const year =
        now.getFullYear();

      const month =
        String(now.getMonth() + 1)
          .padStart(2, "0");

      const day =
        String(now.getDate())
          .padStart(2, "0");

      return `${year}-${month}-${day}`;
    }


    /* =====================================================
       朝メッセージ
       その日1つをランダム選択
       ===================================================== */

    function setMorningMessage() {

      const today =
        getLocalDateKey();

      const storageKey =
        "babyfaceMorningMessage";

      let saved = null;


      try {

        saved =
          JSON.parse(
            localStorage.getItem(storageKey)
          );

      } catch (e) {

        saved = null;

      }


      /*
        同じ日は同じメッセージ。
        翌日になると変更。
      */

      if (
        saved &&
        saved.date === today &&
        typeof saved.index === "number" &&
        saved.index >= 0 &&
        saved.index < morningMessages.length
      ) {

        morningText.textContent =
          morningMessages[saved.index];

        return;
      }


      const randomIndex =
        Math.floor(
          Math.random() *
          morningMessages.length
        );


      morningText.textContent =
        morningMessages[randomIndex];


      try {

        localStorage.setItem(

          storageKey,

          JSON.stringify({

            date: today,

            index: randomIndex

          })

        );

      } catch (e) {

        // 保存できなくても表示は継続

      }

    }


    /* =====================================================
       天気コード
       ===================================================== */

    function weatherInfo(code) {

      if (code === 0) {

        return {
          icon: "☀️",
          text: "快晴"
        };

      }


      if (code === 1) {

        return {
          icon: "🌤️",
          text: "晴れ"
        };

      }


      if (code === 2) {

        return {
          icon: "⛅",
          text: "晴れ時々くもり"
        };

      }


      if (code === 3) {

        return {
          icon: "☁️",
          text: "くもり"
        };

      }


      if (
        code === 45 ||
        code === 48
      ) {

        return {
          icon: "🌫️",
          text: "霧"
        };

      }


      if (
        code >= 51 &&
        code <= 57
      ) {

        return {
          icon: "🌦️",
          text: "小雨"
        };

      }


      if (
        code >= 61 &&
        code <= 67
      ) {

        return {
          icon: "🌧️",
          text: "雨"
        };

      }


      if (
        code >= 71 &&
        code <= 77
      ) {

        return {
          icon: "❄️",
          text: "雪"
        };

      }


      if (
        code >= 80 &&
        code <= 82
      ) {

        return {
          icon: "🌦️",
          text: "にわか雨"
        };

      }


      if (
        code >= 85 &&
        code <= 86
      ) {

        return {
          icon: "🌨️",
          text: "にわか雪"
        };

      }


      if (
        code >= 95 &&
        code <= 99
      ) {

        return {
          icon: "⛈️",
          text: "雷雨"
        };

      }


      return {
        icon: "🌤️",
        text: "天気情報"
      };

    }


    /* =====================================================
       天気取得
       ===================================================== */

    async function loadWeather() {

      weatherContent.innerHTML = `

        <div class="weather-error">
          天気情報を取得しています…
        </div>

      `;


      const url =

        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" +
        WEATHER_LAT +

        "&longitude=" +
        WEATHER_LON +

        "&current=temperature_2m,weather_code" +

        "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +

        "&timezone=Asia%2FTokyo" +

        "&forecast_days=1";


      try {

        const response =
          await fetch(
            url,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Weather API error: " +
            response.status
          );

        }


        const data =
          await response.json();


        const currentTemp =
          data.current.temperature_2m;

        const currentCode =
          data.current.weather_code;

        const maxTemp =
          data.daily.temperature_2m_max[0];

        const minTemp =
          data.daily.temperature_2m_min[0];

        const rainChance =
          data.daily.precipitation_probability_max[0];


        const info =
          weatherInfo(currentCode);


        weatherContent.innerHTML = `

          <div class="weather-main">

            <div class="weather-icon">
              ${info.icon}
            </div>

            <div>

              <div class="weather-condition">
                ${info.text}
              </div>

              <div class="weather-temperature">
                ${currentTemp}℃
              </div>

            </div>

          </div>


          <div class="weather-details">

            <div>
              🌡️ 最高 ${maxTemp}℃
            </div>

            <div>
              最低 ${minTemp}℃
            </div>

            <div>
              ☔ 降水 ${rainChance}%
            </div>

          </div>


          <div class="weather-updated">
            現在の気温・今日の予報
          </div>

        `;

      } catch (error) {

        console.error(
          "天気情報の取得に失敗しました。",
          error
        );


        weatherContent.innerHTML = `

          <div class="weather-error">

            🌤️ 本日の天気情報を取得できませんでした。<br>
            しばらくすると自動的に再取得します。

          </div>

        `;

      }

    }


    /* =====================================================
       朝
       10:00〜10:59
       ===================================================== */

    function isMorningTime() {

      const now = new Date();

      return now.getHours() === 10;

    }


    /* =====================================================
       閉店
       23:00〜23:29
       ===================================================== */

    function isCloseTime() {

      const now = new Date();

      const hour =
        now.getHours();

      const minute =
        now.getMinutes();


      return (
        hour === 23 &&
        minute < 30
      );

    }


    /* =====================================================
       黒画面
       23:30〜09:59
       ===================================================== */

    function isBlackTime() {

      const now = new Date();

      const hour =
        now.getHours();


      return (
        hour >= 23 ||
        hour < 10
      );

    }


    /* =====================================================
       祝日判定
       ===================================================== */

    function holiday(y, m, d) {

      const date =
        new Date(
          y,
          m - 1,
          d
        );

      const day =
        date.getDay();


      /* 元日 */

      if (
        m === 1 &&
        d === 1
      ) {
        return true;
      }


      /* 成人の日 */

      if (
        m === 1 &&
        day === 1 &&
        d >= 8 &&
        d <= 14
      ) {
        return true;
      }


      /* 建国記念の日 */

      if (
        m === 2 &&
        d === 11
      ) {
        return true;
      }


      /* 天皇誕生日 */

      if (
        m === 2 &&
        d === 23
      ) {
        return true;
      }


      /* 春分の日 */

      if (m === 3) {

        const spring =
          Math.floor(
            20.8431 +
            0.242194 *
            (y - 1980) -
            Math.floor(
              (y - 1980) / 4
            )
          );


        if (d === spring) {
          return true;
        }

      }


      /* 昭和の日 */

      if (
        m === 4 &&
        d === 29
      ) {
        return true;
      }


      /* 憲法記念日 */

      if (
        m === 5 &&
        d === 3
      ) {
        return true;
      }


      /* みどりの日 */

      if (
        m === 5 &&
        d === 4
      ) {
        return true;
      }


      /* こどもの日 */

      if (
        m === 5 &&
        d === 5
      ) {
        return true;
      }


      /* 海の日 */

      if (
        m === 7 &&
        day === 1 &&
        d >= 15 &&
        d <= 21
      ) {
        return true;
      }


      /* 山の日 */

      if (
        m === 8 &&
        d === 11
      ) {
        return true;
      }


      /* 敬老の日 */

      if (
        m === 9 &&
        day === 1 &&
        d >= 15 &&
        d <= 21
      ) {
        return true;
      }


      /* 秋分の日 */

      if (m === 9) {

        const autumn =
          Math.floor(
            23.2488 +
            0.242194 *
            (y - 1980) -
            Math.floor(
              (y - 1980) / 4
            )
          );


        if (d === autumn) {
          return true;
        }

      }


      /* スポーツの日 */

      if (
        m === 10 &&
        day === 1 &&
        d >= 8 &&
        d <= 14
      ) {
        return true;
      }


      /* 文化の日 */

      if (
        m === 11 &&
        d === 3
      ) {
        return true;
      }


      /* 勤労感謝の日 */

      if (
        m === 11 &&
        d === 23
      ) {
        return true;
      }


      return false;

    }


    /* =====================================================
       ランキング / ランチ
       ===================================================== */

    function getRankingSlide() {

      const now =
        new Date();

      const day =
        now.getDay();

      const hour =
        now.getHours();


      /*
        月〜金
        11:00〜14:59
        祝日を除く
      */

      if (

        day >= 1 &&
        day <= 5 &&

        hour >= 11 &&
        hour < 15 &&

        !holiday(
          now.getFullYear(),
          now.getMonth() + 1,
          now.getDate()
        )

      ) {

        return "lunch.png";

      }


      return "ranking.png";

    }


    /* =====================================================
       現在のモード
       ===================================================== */

    function getMode() {

      if (isMorningTime()) {
        return "morning";
      }


      if (isCloseTime()) {
        return "close";
      }


      if (isBlackTime()) {
        return "black";
      }


      return "day";

    }


    /* =====================================================
       全画面非表示
       ===================================================== */

    function hideAll() {

      slide.classList.remove("active");

      video.classList.remove("active");

      morning.classList.remove("active");

      closeScreen.classList.remove("active");

      blackScreen.classList.remove("active");


      video.pause();


      if (slideTimer) {

        clearTimeout(
          slideTimer
        );

        slideTimer = null;

      }

    }


    /* =====================================================
       朝画面
       ===================================================== */

    function showMorning() {

      hideAll();

      morning.classList.add("active");

      setMorningMessage();

      loadWeather();

    }


    /* =====================================================
       閉店画面
       ===================================================== */

    function showClose() {

      hideAll();

      closeScreen.classList.add("active");

    }


    /* =====================================================
       黒画面
       ===================================================== */

    function showBlack() {

      hideAll();

      blackScreen.classList.add("active");

    }


    /* =====================================================
       通常画面
       ===================================================== */

    function showDay() {

      hideAll();

      slide.classList.add("active");

      playSlide(0);

    }


    /* =====================================================
       スライド再生
       ===================================================== */

    function playSlide(index) {

      const mode =
        getMode();


      if (mode !== "day") {
        return;
      }


      currentSlide =
        index;


      let src =
        slides[index];


      /*
        3枚目
      */

      if (index === 2) {

        src =
          getRankingSlide();

      }


      /*
        Instagram動画
      */

      if (src === "instagram.mp4") {

        slide.classList.remove("active");

        video.classList.add("active");


        video.currentTime = 0;


        video.play()
          .catch(() => {});


        slideTimer =
          setTimeout(

            () => {

              video.pause();

              video.classList.remove(
                "active"
              );

              slide.classList.add(
                "active"
              );


              playSlide(
                (index + 1) %
                slides.length
              );

            },

            SLIDE_TIME

          );


        return;

      }


      /*
        通常画像
      */

      video.classList.remove(
        "active"
      );

      video.pause();


      slide.src =
        src;


      slide.classList.add(
        "active"
      );


      slideTimer =
        setTimeout(

          () => {

            playSlide(
              (index + 1) %
              slides.length
            );

          },

          SLIDE_TIME

        );

    }


    /* =====================================================
       モード切替
       ===================================================== */

    function showMode(mode) {

      currentMode =
        mode;


      if (mode === "morning") {

        showMorning();

        return;

      }


      if (mode === "close") {

        showClose();

        return;

      }


      if (mode === "black") {

        showBlack();

        return;

      }


      showDay();

    }


    /* =====================================================
       時刻チェック
       ===================================================== */

    function checkTime() {

      const mode =
        getMode();


      if (
        mode !== currentMode
      ) {

        showMode(mode);

      }

    }


    /* =====================================================
       天気を30分ごとに更新
       ===================================================== */

    setInterval(

      () => {

        if (
          currentMode === "morning"
        ) {

          loadWeather();

        }

      },

      WEATHER_UPDATE_TIME

    );


    /* =====================================================
       10秒ごとに時刻確認
       ===================================================== */

    setInterval(

      () => {

        checkTime();

      },

      10000

    );


    /* =====================================================
       起動
       ===================================================== */

    checkTime();


    /* =====================================================
       フルスクリーン
       ===================================================== */

    document.addEventListener(

      "click",

      () => {

        if (
          document.fullscreenElement
        ) {
          return;
        }


        const element =
          document.documentElement;


        if (
          element.requestFullscreen
        ) {

          element
            .requestFullscreen()
            .catch(() => {});

        }

      },

      {
        once: true
      }

    );


    /* =====================================================
       タッチでもフルスクリーン
       ===================================================== */

    document.addEventListener(

      "touchstart",

      () => {

        if (
          document.fullscreenElement
        ) {
          return;
        }


        const element =
          document.documentElement;


        if (
          element.requestFullscreen
        ) {

          element
            .requestFullscreen()
            .catch(() => {});

        }

      },

      {
        once: true
      }

    );

  </script>

</body>
</html>
